<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palimpsest Compare</title>
<meta name="description" content="Compare old maps with today's world by fading, swiping or looking through a spyglass.">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: the map fills the window; a survey "drawer" floats left, the comparison controls float bottom-centre. */
:root {
  --ink: #22302a;          /* field-notebook green-black */
  --ink-soft: #6c776f;
  --paper: #fbfaf6;        /* panel ground */
  --paper-2: #eeebe3;      /* the paper behind the map */
  --line: rgba(34,48,42,.16);
  --accent: #d4492a;       /* signal red: the swipe line, the lens */
  --accent-ink: #ffffff;
  --water: #5f8f7d;        /* sage, for links and notes */
  --shadow: 0 10px 30px rgba(34,48,42,.12);
  --f-display: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-ui: "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-note: "Cormorant Garamond", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.4 var(--f-ui); overflow: hidden; }
#map { position: fixed; inset: 0; background: var(--paper-2); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Drawer ---------- */
.drawer {
  position: fixed; z-index: 1000;
  top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; bottom: 12px;
  width: min(340px, calc(100vw - 24px));
  display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  box-shadow: var(--shadow); overflow: hidden;
  transition: transform .25s ease;
}
.drawer.closed { transform: translateX(calc(-100% - 24px)); }
.drawer header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.brand h1 { margin: 0; font: 400 26px/1 var(--f-display); letter-spacing: .01em; }
.brand h1 i { color: var(--accent); }
.brand small { font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper-2); }
.list { flex: 1; overflow-y: auto; padding: 4px 0 8px; }
.group h2 {
  margin: 0; padding: 12px 16px 4px; position: sticky; top: 0; background: var(--paper);
  font: 500 10.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft);
}
.item {
  display: grid; grid-template-columns: 52px 1fr; gap: 10px; align-items: center;
  width: 100%; text-align: left; padding: 8px 16px; border: 0; background: none; cursor: pointer;
  border-left: 3px solid transparent;
}
.item:hover { background: var(--paper-2); }
.item.active { background: var(--paper-2); border-left-color: var(--accent); }
.yr { font: 500 12px/1.1 var(--f-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.item .t { font: 400 16px/1.15 var(--f-display); display: block; }
.item .s { font-size: 12px; color: var(--ink-soft); display: block; margin-top: 2px; }
.custom { border-top: 1px solid var(--line); padding: 12px 16px 14px; display: grid; gap: 6px; }
.custom label { font: 500 10.5px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
.custom .row { display: flex; gap: 6px; }
.custom input { flex: 1; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--paper-2); font-size: 12.5px; }
.custom p { margin: 0; font-size: 11.5px; color: var(--ink-soft); }
.custom p.err { color: var(--accent); }
.btn { padding: 7px 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 4px; cursor: pointer; font-weight: 500; }
.btn:hover { opacity: .9; }

.drawer-toggle {
  position: fixed; z-index: 1001; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px;
  display: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--paper); box-shadow: var(--shadow); cursor: pointer; font-weight: 500;
}
.drawer.closed ~ .drawer-toggle { display: block; }
.drawer-close { border: 0; background: none; cursor: pointer; font-size: 20px; line-height: 1; color: var(--ink-soft); padding: 2px 4px; }

/* ---------- Comparison bar ---------- */
.bar {
  position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; justify-content: center;
  padding: 10px 14px; max-width: calc(100vw - 24px);
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
}
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { padding: 6px 11px; border: 0; background: none; cursor: pointer; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.slider { display: flex; align-items: center; gap: 8px; }
.slider span { font: 500 11px/1 var(--f-mono); color: var(--ink-soft); min-width: 3.5ch; text-align: right; font-variant-numeric: tabular-nums; }
.slider input { width: 130px; accent-color: var(--accent); }
.slider .yearval { font: 400 20px/1 var(--f-display); color: var(--accent); min-width: 4ch; }
.tag { font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.iconbtn { padding: 6px 10px; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; font-weight: 500; }

/* ---------- Title cartouche ---------- */
.cartouche {
  position: fixed; z-index: 999; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px;
  max-width: min(360px, calc(100vw - 24px)); padding: 10px 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow);
}
.cartouche .yr { font-size: 11px; letter-spacing: .08em; }
.cartouche h3 { margin: 2px 0 2px; font: 400 20px/1.15 var(--f-display); text-wrap: balance; }
.cartouche p { margin: 0; font-size: 12px; color: var(--ink-soft); }
.cartouche a { color: var(--water); }

/* ---------- Swipe divider & lens ---------- */
.divider { position: fixed; z-index: 900; top: 0; bottom: 0; width: 0; pointer-events: none; }
.divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--accent); }
.divider .handle {
  position: absolute; top: 50%; left: 0; transform: translate(-50%, -50%);
  width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; font: 600 14px/1 var(--f-mono); cursor: ew-resize; pointer-events: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,.3); touch-action: none; user-select: none;
}
.divider .lbl {
  position: absolute; top: calc(50% + 28px); transform: translateX(-50%); white-space: nowrap;
  font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase;
  background: var(--paper); color: var(--ink); padding: 4px 6px; border-radius: 3px; border: 1px solid var(--line);
}
.lens-ring { position: fixed; z-index: 900; pointer-events: none; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 0 1px rgba(255,255,255,.5), 0 6px 18px rgba(0,0,0,.3); }

.coords { position: fixed; z-index: 998; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font: 500 11px/1 var(--f-mono); background: var(--paper); color: var(--ink-soft); padding: 5px 7px; border-radius: 3px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }

.leaflet-control-zoom a { background: var(--paper) !important; color: var(--ink) !important; border-color: var(--line) !important; }
.leaflet-container { font-family: var(--f-ui); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--paper) 85%, transparent) !important; color: var(--ink-soft) !important; }
.leaflet-control-attribution a { color: var(--water) !important; }
.leaflet-control-scale-line { background: var(--paper); color: var(--ink); border-color: var(--ink); font-family: var(--f-mono); }

@media (max-width: 720px) {
  .drawer { bottom: auto; max-height: 55vh; }
  .cartouche { display: none; }
  .coords { display: none; }
  .slider input { width: 100px; }
  .bar { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
}
/* Field line type: bold sans for names, italic serif for notes */
.brand h1 { font-weight: 800; letter-spacing: -.03em; }
.brand h1 i { font-style: normal; }
.item .t { font: 600 15px/1.2 var(--f-ui); }
.item .s, .custom p, .cartouche p { font-family: var(--f-note); font-size: 14px; }
.cartouche h3 { font-weight: 800; letter-spacing: -.02em; }
.drawer, .bar, .cartouche { border-radius: 14px; }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Map"></div>

<aside class="drawer" id="drawer">
  <header>
    <div class="brand">
      <h1>Palim<i>psest</i></h1>
      <button class="drawer-close" id="closeDrawer" aria-label="Hide map list" title="Hide (Esc)">×</button>
    </div>
    <small class="tag">Old maps, laid over today · <a href="index.html" style="color:var(--accent)">← Time machine</a></small>
    <input id="search" class="search" type="search" placeholder="Filter by place or year" aria-label="Filter maps">
  </header>
  <div class="list" id="list"></div>
  <form class="custom" id="customForm">
    <label for="customInput">Add any georeferenced map</label>
    <div class="row">
      <input id="customInput" placeholder="Allmaps link or XYZ tile URL" autocomplete="off">
      <button class="btn" type="submit">Add</button>
    </div>
    <p id="customMsg">Paste an Allmaps viewer or annotation link, or a tile template with {z}/{x}/{y}.</p>
  </form>
</aside>
<button class="drawer-toggle" id="openDrawer">☰ Maps</button>

<div class="cartouche" id="cartouche" hidden>
  <div class="yr" id="cYear"></div>
  <h3 id="cTitle"></h3>
  <p id="cSub"></p>
</div>

<div class="bar" role="toolbar" aria-label="Comparison controls">
  <div class="seg" id="modeSeg" aria-label="Compare mode">
    <button type="button" data-mode="fade" aria-pressed="true" title="Fade (1)">Fade</button>
    <button type="button" data-mode="swipe" aria-pressed="false" title="Swipe (2)">Swipe</button>
    <button type="button" data-mode="lens" aria-pressed="false" title="Spyglass (3)">Spyglass</button>
  </div>
  <div class="slider" id="opacityWrap">
    <span class="tag">Old</span>
    <input id="opacity" type="range" min="0" max="100" value="80" aria-label="Old map opacity">
    <span id="opacityVal">80%</span>
  </div>
  <div class="slider" id="yearWrap" hidden>
    <span class="tag">Year</span>
    <input id="year" type="range" min="0" max="0" value="0" step="1" aria-label="Map year">
    <span id="yearVal" class="yearval">1900</span>
  </div>
  <div class="slider" id="lensWrap" hidden>
    <span class="tag">Lens</span>
    <input id="lensSize" type="range" min="80" max="400" value="180" aria-label="Spyglass size">
  </div>
  <div class="seg" id="baseSeg" aria-label="Modern map">
    <button type="button" data-base="streets" aria-pressed="true">Streets</button>
    <button type="button" data-base="satellite" aria-pressed="false">Satellite</button>
    <button type="button" data-base="osm" aria-pressed="false">OSM</button>
    <button type="button" data-base="light" aria-pressed="false">Plain</button>
  </div>
  <button type="button" class="iconbtn" id="fsBtn" title="Full screen (F)">⛶ Full screen</button>
</div>

<div class="divider" id="divider" hidden><div class="handle" aria-label="Drag to compare">⇆</div><div class="lbl" id="divLbl">◂ Then · Now ▸</div></div>
<div class="lens-ring" id="lensRing" hidden></div>
<div class="coords" id="coords">—</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const A = (href, name) => `<a href="${href}" target="_blank" rel="noopener">${name}</a>`;
const AM_ATTR = (who) => `Historic map: ${who}, warped by ${A("https://allmaps.org/", "Allmaps")}`;
const IGNF = (layer, fmt) => `https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=${fmt}`;
const IGNF_ATTR = "Historic map: " + A("https://www.geoportail.gouv.fr/", "IGN France");
const IGNES = (layer) => `https://www.ign.es/wmts/primera-edicion-mtn?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=${layer}&STYLE=default&TILEMATRIXSET=GoogleMapsCompatible&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&FORMAT=image/jpeg`;
const IGNES_ATTR = "Historic map: " + A("https://www.ign.es/", "Instituto Geográfico Nacional");
const SWISS_ATTR = "Historic map: " + A("https://www.swisstopo.admin.ch/", "swisstopo");
const GSI_ATTR = "Historic imagery: " + A("https://maps.gsi.go.jp/", "Geospatial Information Authority of Japan");
const NLS = "https://mapseries-tilesets.s3.amazonaws.com/";
const NLS_ATTR = "Historic map: " + A("https://maps.nls.uk/", "National Library of Scotland");
const FRANCE = [[41.3,-5.2],[51.1,9.6]], SWISS = [[45.8,5.9],[47.85,10.5]], SPAIN = [[35.9,-9.4],[43.9,4.4]];
const SWISS_YEARS = [1864,1870,1880,1890,1900,1910,1920,1930,1938,1950,1960,1970,1980,1990,2000];

// Curated catalogue. Every tile source here was checked to serve tiles without a key.
const CATALOG = [
  { id: "london-1890s", region: "Great Britain", year: "1893–96", title: "London, Five-foot town plan", sub: "Ordnance Survey 1:1,056 · street-by-street, every building",
    url: NLS + "london_1890s/{z}/{x}/{y}.png", maxNative: 20, bounds: [[51.28,-0.56],[51.72,0.33]], view: [51.5079,-0.0877,16], attr: NLS_ATTR },
  { id: "london-1940s", region: "Great Britain", year: "1940s", title: "London, National Grid plans", sub: "Ordnance Survey 1:1,250 · just before post-war rebuilding",
    url: NLS + "london_1940s/{z}/{x}/{y}.png", maxNative: 19, bounds: [[51.28,-0.56],[51.72,0.33]], view: [51.5138,-0.0984,16], attr: NLS_ATTR },
  { id: "gb-tenmile", region: "Great Britain", year: "1955", title: "Ten-mile General Map", sub: "Ordnance Survey 1:633,600 · the whole island on one sheet",
    url: NLS + "ten_mile/general/{z}/{x}/{y}.png", maxNative: 12, bounds: [[49.7,-9],[61,2.2]], view: [54.6,-3.2,7], attr: NLS_ATTR },
  { id: "sc-roy", region: "Great Britain", year: "1752–55", title: "Roy Military Survey of Scotland", sub: "Hand-drawn after the Jacobite rising of 1745",
    url: NLS + "roy/lowlands/{z}/{x}/{y}.png", maxNative: 14, bounds: [[54.6,-6.3],[57.1,-1.5]], view: [55.95,-3.2,12], attr: NLS_ATTR },
  { id: "sc-6inch-1", region: "Great Britain", year: "1843–82", title: "Scotland, Six-inch first edition", sub: "Ordnance Survey 1:10,560 · Edinburgh's Old and New Towns",
    url: NLS + "os/6inchfirst/{z}/{x}/{y}.png", maxNative: 17, bounds: [[54.6,-8.7],[60.9,-0.7]], view: [55.9486,-3.1999,15], attr: NLS_ATTR },
  { id: "sc-6inch-2", region: "Great Britain", year: "1892–1960", title: "Scotland, Six-inch later editions", sub: "Ordnance Survey 1:10,560 · industrial Glasgow",
    url: NLS + "os/6inchsecond/{z}/{x}/{y}.png", maxNative: 17, bounds: [[54.6,-8.7],[60.9,-0.7]], view: [55.8609,-4.2514,15], attr: NLS_ATTR },
  { id: "sc-1inch-2", region: "Great Britain", year: "1885–1900", title: "Scotland, One-inch second edition", sub: "Ordnance Survey 1:63,360 · hills drawn with hachures",
    url: NLS + "1inch_2nd_ed/{z}/{x}/{y}.png", maxNative: 16, bounds: [[54.6,-8.7],[60.9,-0.7]], view: [56.12,-4.62,11], attr: NLS_ATTR },
  { id: "ch-time", region: "Switzerland", year: "1864–2000", title: "Journey through time", sub: "The national map as it stood in any year · drag the year slider",
    url: "https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.zeitreihen/default/{year}1231/3857/{z}/{x}/{y}.png", years: SWISS_YEARS, startYear: 1900,
    maxNative: 17, bounds: SWISS, view: [47.3739,8.5410,14], attr: SWISS_ATTR },
  { id: "ch-dufour", region: "Switzerland", year: "1845–65", title: "Dufour map", sub: "Switzerland's first official survey, engraved with dramatic hill shading",
    url: "https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.hiks-dufour/default/current/3857/{z}/{x}/{y}.png", maxNative: 15, bounds: SWISS, view: [46.62,8.0,10], attr: SWISS_ATTR },
  { id: "fr-cassini", region: "France", year: "1756–1815", title: "Carte de Cassini", sub: "The first map of an entire country made by triangulation",
    url: IGNF("BNF-IGNF_GEOGRAPHICALGRIDSYSTEMS.CASSINI", "image/png"), maxNative: 14, bounds: FRANCE, view: [48.8566,2.3522,12], attr: IGNF_ATTR },
  { id: "fr-etatmajor", region: "France", year: "1820–66", title: "Carte de l'état-major", sub: "Hand-coloured military survey · Paris before Haussmann",
    url: IGNF("GEOGRAPHICALGRIDSYSTEMS.ETATMAJOR40", "image/jpeg"), maxNative: 15, bounds: FRANCE, view: [48.8606,2.3376,14], attr: IGNF_ATTR },
  { id: "fr-1950", region: "France", year: "1950–65", title: "France from the air", sub: "Post-war aerial photographs, nationwide",
    url: IGNF("ORTHOIMAGERY.ORTHOPHOTOS.1950-1965", "image/png"), maxNative: 18, bounds: FRANCE, view: [48.8584,2.2945,16], attr: IGNF_ATTR },
  { id: "es-minutas", region: "Spain", year: "1870–1950", title: "Minutas cartográficas", sub: "Field drafts for the national map, block by block",
    url: IGNES("catastrones"), maxNative: 17, bounds: SPAIN, view: [40.4168,-3.7038,15], attr: IGNES_ATTR },
  { id: "es-mtn50", region: "Spain", year: "1875–1968", title: "MTN50, first edition", sub: "National topographic map 1:50,000",
    url: IGNES("mtn50-edicion1"), maxNative: 15, bounds: SPAIN, view: [40.4168,-3.7038,12], attr: IGNES_ATTR },
  { id: "jp-usa10", region: "Japan", year: "1945–50", title: "Tokyo from the air, post-war", sub: "US Army aerial survey, months after the firebombing",
    url: "https://cyberjapandata.gsi.go.jp/xyz/ort_USA10/{z}/{x}/{y}.png", maxNative: 17, bounds: [[24,122],[46,146]], view: [35.6812,139.7671,15], attr: GSI_ATTR },
  { id: "jp-old10", region: "Japan", year: "1961–64", title: "Tokyo before the Olympics", sub: "Aerial photos from the run-up to the 1964 Games",
    url: "https://cyberjapandata.gsi.go.jp/xyz/ort_old10/{z}/{x}/{y}.png", maxNative: 17, bounds: [[24,122],[46,146]], view: [35.6655,139.7000,15], attr: GSI_ATTR },
  { id: "nyc-hammond", region: "United States", year: "c. 1910s", title: "Hammond's New York City", sub: "Manhattan & the Bronx with elevated and subway lines",
    url: "https://allmaps.xyz/images/d180902cb93d5bf2/{z}/{x}/{y}.png", bounds: [[40.7001,-73.9945],[40.8715,-73.8426]], attr: AM_ATTR(A("https://www.digitalcommonwealth.org/", "Digital Commonwealth")) },
  { id: "boston-1896", region: "United States", year: "1896", title: "Winthrop Steamboat Co. routes", sub: "East Boston, Chelsea and Winthrop across Boston Harbor",
    url: "https://allmaps.xyz/maps/a9458d2f895dcdfb/{z}/{x}/{y}.png", bounds: [[42.3603,-71.0412],[42.3967,-70.9711]], attr: AM_ATTR(A("https://www.digitalcommonwealth.org/", "Digital Commonwealth")) },
  { id: "thumb-mi", region: "United States", year: "Mid-1900s", title: "Thumb of Michigan vacation map", sub: "Tourist map of the Lake Huron shore",
    url: "https://allmaps.xyz/maps/29d81a9b08f16990/{z}/{x}/{y}.png", bounds: [[42.0956,-83.9361],[44.0728,-82.4087]], attr: AM_ATTR(A("https://d.lib.msu.edu/", "MSU Libraries")) },
  { id: "rotterdam", region: "Netherlands & Italy", year: "1940s", title: "Rotterdam from the air", sub: "Aerial photo of the city centre cleared after the 1940 bombing",
    url: "https://allmaps.xyz/maps/7fa68f258b316b33/{z}/{x}/{y}.png", bounds: [[51.9124,4.4761],[51.9265,4.4981]], attr: AM_ATTR(A("https://www.nationaalarchief.nl/", "Nationaal Archief")) },
  { id: "naples", region: "Netherlands & Italy", year: "1800s", title: "Kingdom of Naples", sub: "Charte von dem Königreiche Neapel, by Ferd. Götze",
    url: "https://allmaps.xyz/maps/8211d0aca500e857/{z}/{x}/{y}.png", bounds: [[38.1822,13.9078],[40.726,18.2808]], attr: AM_ATTR(A("https://collections.library.yale.edu/", "Yale Library")) },
];

const ESRI = (svc) => `https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/{z}/{y}/{x}`;
const BASES = {
  streets: L.tileLayer(ESRI("World_Street_Map"), { maxZoom: 20, maxNativeZoom: 19, attribution: "Basemap &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors" }),
  satellite: L.tileLayer(ESRI("World_Imagery"), { maxZoom: 20, maxNativeZoom: 19, attribution: "Imagery &copy; Esri, Maxar, Earthstar Geographics" }),
  osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 20, maxNativeZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }),
  light: L.tileLayer(ESRI("Canvas/World_Light_Gray_Base"), { maxZoom: 20, maxNativeZoom: 16, attribution: "Basemap &copy; Esri, HERE, Garmin" }),
};

const map = L.map("map", { zoomControl: false, maxZoom: 20, worldCopyJump: true, zoomSnap: 0.25, zoomDelta: 0.5 });
L.control.zoom({ position: "bottomleft" }).addTo(map);
L.control.scale({ position: "bottomleft", imperial: true }).addTo(map);
map.attributionControl.setPrefix(false);

const store = {
  get(k) { try { return localStorage.getItem("palimpsest:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("palimpsest:" + k, v); } catch {} },
};

const state = {
  base: "streets", mode: "fade", opacity: 0.8, lensR: 90, split: 0.5,
  pointer: null, current: null, layer: null,
};

/* ---------- Basemap ---------- */
function setBase(name) {
  Object.values(BASES).forEach(b => map.hasLayer(b) && map.removeLayer(b));
  BASES[name].addTo(map).bringToBack();
  state.base = name;
  document.querySelectorAll("#baseSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.base === name)));
  store.set("base", name);
}

/* ---------- Old map layer ---------- */
function showMap(entry, { fly = true } = {}) {
  if (state.layer) map.removeLayer(state.layer);
  const opts = {
    maxZoom: 20, opacity: state.mode === "fade" ? state.opacity : 1,
    attribution: entry.attr, className: "old-map", zIndex: 10,
    errorTileUrl: "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==",
  };
  if (entry.maxNative) opts.maxNativeZoom = entry.maxNative;
  const yw = document.getElementById("yearWrap");
  yw.hidden = !entry.years;
  if (entry.years) {
    if (!entry.years.includes(state.year)) state.year = entry.startYear || entry.years[0];
    opts.year = state.year;
    const yr = document.getElementById("year");
    yr.max = entry.years.length - 1;
    yr.value = entry.years.indexOf(state.year);
    document.getElementById("yearVal").textContent = state.year;
  }
  if (entry.bounds) opts.bounds = L.latLngBounds(entry.bounds).pad(0.05);
  state.layer = L.tileLayer(entry.url, opts).addTo(map);
  state.current = entry;
  state.layer.on("tileload load", applyClip);

  if (fly) {
    if (entry.view) map.flyTo([entry.view[0], entry.view[1]], entry.view[2], { duration: 1.2 });
    else if (entry.bounds) map.flyToBounds(entry.bounds, { padding: [40, 40], duration: 1.2 });
  }
  document.querySelectorAll(".item").forEach(el => el.classList.toggle("active", el.dataset.id === entry.id));
  const c = document.getElementById("cartouche");
  c.hidden = false;
  document.getElementById("cYear").textContent = entry.years ? `Showing ${state.year} · range ${entry.year}` : (entry.year || "");
  document.getElementById("cTitle").textContent = entry.title;
  document.getElementById("cSub").textContent = entry.sub || "";
  store.set("map", entry.id);
  requestAnimationFrame(applyClip);
}

/* ---------- Compare modes (clip the old-map tile container) ---------- */
function applyClip() {
  if (!state.layer) return;
  const el = state.layer.getContainer();
  if (!el) return;
  const size = map.getSize();
  const nw = map.containerPointToLayerPoint([0, 0]);
  const se = map.containerPointToLayerPoint(size);
  const rect = map.getContainer().getBoundingClientRect();
  if (state.mode === "swipe") {
    const x = nw.x + size.x * state.split;
    el.style.clipPath = "none";
    el.style.clip = `rect(${nw.y}px, ${x}px, ${se.y}px, ${nw.x}px)`;
    const d = document.getElementById("divider");
    d.style.left = (rect.left + size.x * state.split) + "px";
  } else if (state.mode === "lens") {
    el.style.clip = "auto";
    const p = state.pointer || L.point(size.x / 2, size.y / 2);
    const lp = map.containerPointToLayerPoint(p);
    el.style.clipPath = `circle(${state.lensR}px at ${lp.x}px ${lp.y}px)`;
    const ring = document.getElementById("lensRing");
    ring.style.width = ring.style.height = state.lensR * 2 + "px";
    ring.style.left = (rect.left + p.x - state.lensR) + "px";
    ring.style.top = (rect.top + p.y - state.lensR) + "px";
  } else {
    el.style.clip = "auto";
    el.style.clipPath = "none";
  }
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll("#modeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  document.getElementById("divider").hidden = mode !== "swipe";
  document.getElementById("lensRing").hidden = mode !== "lens";
  document.getElementById("lensWrap").hidden = mode !== "lens";
  document.getElementById("opacityWrap").hidden = mode !== "fade";
  if (state.layer) state.layer.setOpacity(mode === "fade" ? state.opacity : 1);
  store.set("mode", mode);
  applyClip();
}

map.on("move zoom viewreset resize zoomanim", applyClip);
map.on("mousemove", e => {
  state.pointer = e.containerPoint;
  document.getElementById("coords").textContent =
    `${e.latlng.lat.toFixed(5)}°, ${e.latlng.lng.toFixed(5)}°  z${map.getZoom().toFixed(1)}`;
  if (state.mode === "lens") applyClip();
});
map.on("touchmove", applyClip);

/* Swipe handle drag */
(() => {
  const handle = document.querySelector("#divider .handle");
  let dragging = false;
  handle.addEventListener("pointerdown", e => { dragging = true; handle.setPointerCapture(e.pointerId); map.dragging.disable(); });
  handle.addEventListener("pointermove", e => {
    if (!dragging) return;
    const r = map.getContainer().getBoundingClientRect();
    state.split = Math.min(0.98, Math.max(0.02, (e.clientX - r.left) / r.width));
    applyClip();
  });
  const stop = () => { dragging = false; map.dragging.enable(); };
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
  handle.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") state.split = Math.max(0.02, state.split - 0.03);
    if (e.key === "ArrowRight") state.split = Math.min(0.98, state.split + 0.03);
    applyClip();
  });
  handle.tabIndex = 0;
})();

/* ---------- List ---------- */
function renderList(filter = "") {
  const q = filter.trim().toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";
  const all = CATALOG.concat(customMaps);
  const regions = [...new Set(all.map(m => m.region))];
  regions.forEach(region => {
    const items = all.filter(m => m.region === region && (!q || [m.title, m.sub, m.year, m.region].join(" ").toLowerCase().includes(q)));
    if (!items.length) return;
    const g = document.createElement("section");
    g.className = "group";
    g.innerHTML = `<h2>${region}</h2>`;
    items.forEach(m => {
      const b = document.createElement("button");
      b.type = "button"; b.className = "item"; b.dataset.id = m.id;
      if (state.current && state.current.id === m.id) b.classList.add("active");
      b.innerHTML = `<span class="yr"></span><span><span class="t"></span><span class="s"></span></span>`;
      b.querySelector(".yr").textContent = m.year;
      b.querySelector(".t").textContent = m.title;
      b.querySelector(".s").textContent = m.sub;
      b.addEventListener("click", () => { showMap(m); if (innerWidth < 720) closeDrawer(); });
      g.appendChild(b);
    });
    list.appendChild(g);
  });
  if (!list.children.length) list.innerHTML = `<p style="padding:16px;color:var(--ink-soft)">No maps match “${q.replace(/[<>&]/g, "")}”.</p>`;
}
document.getElementById("search").addEventListener("input", e => renderList(e.target.value));

/* ---------- Custom maps ---------- */
let customMaps = [];
async function addCustom(raw) {
  const msg = document.getElementById("customMsg");
  msg.className = ""; msg.textContent = "Loading…";
  let input = raw.trim();
  try {
    // Allmaps viewer link: pull the annotation url out of it
    const urlParam = input.match(/[?#&]url=([^&]+)/);
    if (urlParam && /allmaps/.test(input)) input = decodeURIComponent(urlParam[1]);

    let entry;
    if (/\{z\}/.test(input) && /\{x\}/.test(input) && /\{y\}/.test(input)) {
      entry = { url: input, title: "Custom tile layer", sub: new URL(input.replace(/[{}]/g, "")).hostname };
    } else {
      let annUrl;
      if (/^[0-9a-f]{16}$/i.test(input)) annUrl = "https://annotations.allmaps.org/maps/" + input;
      else if (/^https?:\/\//.test(input)) annUrl = input;
      else throw new Error("That doesn't look like a link. Paste a full https:// address.");
      const res = await fetch(annUrl);
      if (!res.ok) throw new Error(`The annotation server answered ${res.status}. Check the link.`);
      const ann = await res.json();
      const items = ann.items || [ann];
      const pts = items.flatMap(it => (it.body && it.body.features || []).map(f => f.geometry.coordinates));
      if (!pts.length) throw new Error("No georeference points found in that annotation.");
      const lats = pts.map(p => p[1]), lngs = pts.map(p => p[0]);
      const label = items[0]?.target?.source?.partOf?.[0]?.partOf?.[0]?.label || items[0]?.target?.source?.partOf?.[0]?.label;
      const title = label ? Object.values(label).flat()[0] : "Allmaps map";
      const m = annUrl.match(/annotations\.allmaps\.org\/(maps|images|manifests)\/([0-9a-f]{16})/);
      const url = m ? `https://allmaps.xyz/${m[1]}/${m[2]}/{z}/{x}/{y}.png`
                    : `https://allmaps.xyz/{z}/{x}/{y}.png?url=${encodeURIComponent(annUrl)}`;
      entry = { url, title: title.length > 70 ? title.slice(0, 68) + "…" : title, sub: `${items.length} sheet${items.length > 1 ? "s" : ""} via Allmaps`,
        bounds: [[Math.min(...lats), Math.min(...lngs)], [Math.max(...lats), Math.max(...lngs)]] };
    }
    entry.id = "custom-" + Date.now();
    entry.region = "Added by you";
    entry.year = "—";
    entry.attr = entry.attr || "Historic map: user supplied";
    customMaps.push(entry);
    renderList(document.getElementById("search").value);
    showMap(entry);
    msg.textContent = `Added “${entry.title}”.`;
    document.getElementById("customInput").value = "";
  } catch (err) {
    msg.className = "err";
    msg.textContent = err.message || "Couldn't load that map.";
  }
}
document.getElementById("customForm").addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("customInput").value; if (v.trim()) addCustom(v); });

/* ---------- Controls ---------- */
document.getElementById("year").addEventListener("input", e => {
  const entry = state.current;
  if (!entry || !entry.years) return;
  state.year = entry.years[+e.target.value];
  document.getElementById("yearVal").textContent = state.year;
  document.getElementById("cYear").textContent = `Showing ${state.year} · range ${entry.year}`;
  clearTimeout(state.yearTimer);
  state.yearTimer = setTimeout(() => { state.layer.options.year = state.year; state.layer.redraw(); }, 120);
});
const opacity = document.getElementById("opacity");
opacity.addEventListener("input", () => {
  state.opacity = opacity.value / 100;
  document.getElementById("opacityVal").textContent = opacity.value + "%";
  if (state.layer && state.mode === "fade") state.layer.setOpacity(state.opacity);
});
document.getElementById("lensSize").addEventListener("input", e => { state.lensR = +e.target.value / 2; applyClip(); });
document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll("#baseSeg button").forEach(b => b.addEventListener("click", () => setBase(b.dataset.base)));

const drawer = document.getElementById("drawer");
function closeDrawer() { drawer.classList.add("closed"); }
function openDrawer() { drawer.classList.remove("closed"); }
document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
document.getElementById("openDrawer").addEventListener("click", openDrawer);

function toggleFullscreen() {
  const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  p && p.catch && p.catch(() => {});
}
document.getElementById("fsBtn").addEventListener("click", toggleFullscreen);

document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "1") setMode("fade");
  if (e.key === "2") setMode("swipe");
  if (e.key === "3") setMode("lens");
  if (e.key === "f" || e.key === "F") toggleFullscreen();
  if (e.key === "Escape") drawer.classList.toggle("closed");
  if ((e.key === "," || e.key === ".") && state.current && state.current.years) {
    const yr = document.getElementById("year");
    yr.value = Math.max(0, Math.min(+yr.max, +yr.value + (e.key === "." ? 1 : -1)));
    yr.dispatchEvent(new Event("input"));
  }
  if (e.key === "[" || e.key === "]") {
    opacity.value = Math.max(0, Math.min(100, +opacity.value + (e.key === "]" ? 10 : -10)));
    opacity.dispatchEvent(new Event("input"));
  }
});

/* ---------- Boot ---------- */
setBase(BASES[store.get("base")] ? store.get("base") : "streets");
renderList();
const startEntry = CATALOG.find(m => m.id === store.get("map")) || CATALOG[0];
map.setView([startEntry.view ? startEntry.view[0] : 51.5, startEntry.view ? startEntry.view[1] : 0], startEntry.view ? startEntry.view[2] : 12);
showMap(startEntry, { fly: false });
if (!startEntry.view && startEntry.bounds) map.fitBounds(startEntry.bounds, { padding: [40, 40] });
setMode(["fade", "swipe", "lens"].includes(store.get("mode")) ? store.get("mode") : "fade");
</script>
</body>
</html>
